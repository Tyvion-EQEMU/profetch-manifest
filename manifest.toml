# ProPatch manifest — defines all components and files managed by ProPatch
# Edit this file to add/remove/update components without a ProPatch code release.

[meta]
version = "1"

# ── ProPatch patcher (self-update) ────────────────────────────────────────────
# When an update is available, the GUI performs a ps1-swap restart automatically.

[[components]]
id = "propatch"
name = "ProPatch"
owner = "Tyvion-EQEMU"
repo = "ProPatch"
tracking = "release_tag"
release_asset_name = "propatch.exe"
destination = ""
protected_patterns = []
show_version = true

# ── MQ directory components ────────────────────────────────────────────────────
# Installed under mq_rekkas (configured in settings.toml or settings.local.toml).

[[components]]
id = "rekkas_mq"
name = "MQ Install (Rekkas)"
owner = "RekkasGit"
repo = "E3NextAndMQNextBinary"
tracking = "release_tag"
destination = ""
protected_patterns = ["config/*", "MacroQuest.ini"]
show_version = true

[[components]]
id = "mq2rwarp"
name = "MQ2RWarp"
owner = "Tyvion-EQEMU"
repo = "MQ2RWarp"
tracking = "release_tag"
destination = "plugins"
release_asset_name = "MQ2RWarp.dll"
protected_patterns = []

[[components]]
id = "rgmercs"
name = "RGMercs"
owner = "DerpleDude"
repo = "rgmercs"
tracking = "release_tag"
release_asset_name = "rgmercs.zip"
extract_asset = true
destination = "lua/rgmercs"
protected_patterns = ["config/*"]
show_version = true

[[components]]
id = "proloot"
name = "ProLoot"
owner = "Tyvion-EQEMU"
repo = "proLoot"
tracking = "release_tag"
destination = "lua/proloot"
zip_subdir = "proloot"
protected_patterns = ["config/*"]
show_version = true

[[components]]
id = "protask"
name = "ProTask"
owner = "Tyvion-EQEMU"
repo = "ProTask"
tracking = "release_tag"
destination = "lua/protask"
zip_subdir = "protask"
protected_patterns = []
show_version = true

# ── EQ client directory files ──────────────────────────────────────────────────
# Downloaded on every `propatch update` and installed into each configured eq_dir.
# destination is relative to each EQ directory root; "" = root.

[[eq_files]]
id = "spells_us"
name = "Spells (spells_us.txt)"
filename = "spells_us.txt"
url = "http://spire.eqprofusion.org:3000/api/v1/eqemuserver/export-client-file/spells"
destination = ""

[[eq_files]]
id = "dbstr_us"
name = "DB Strings (dbstr_us.txt)"
filename = "dbstr_us.txt"
url = "http://spire.eqprofusion.org:3000/api/v1/eqemuserver/export-client-file/dbstring"
destination = ""

[[eq_files]]
id = "skillcaps"
name = "Skill Caps (SkillCaps.txt)"
filename = "SkillCaps.txt"
url = "http://spire.eqprofusion.org:3000/api/v1/eqemuserver/export-client-file/skills"
destination = "Resources"

[[eq_files]]
id = "basedata"
name = "Base Data (BaseData.txt)"
filename = "BaseData.txt"
url = "http://spire.eqprofusion.org:3000/api/v1/eqemuserver/export-client-file/basedata"
destination = "Resources"

[[eq_files]]
id = "dinput8"
name = "DirectInput Shim (dinput8.dll)"
filename = "dinput8.dll"
url = "http://downloads.eqprofusion.org/dinput8.dll"
destination = ""

# ── Help packs (GitHub zip, installed to each EQ directory) ───────────────────
# Tracked by commit SHA; only re-downloaded when updated.

[[help_packs]]
id = "profusion_help"
name = "EQProfusion Help Files"
owner = "Tyvion-EQEMU"
repo = "profusion-help"
branch = "main"
tracking = "commit_sha"
destination = "help"
